[build]
  publish = "public"
  command = "echo 'Static site — no build step'"

# Serve the dashboard HTML at the root
[[redirects]]
  from = "/"
  to   = "/index.html"
  status = 200

# Make data.json cache-busted but still served from public/
[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

# Scheduled function — runs at the top of every hour
[functions]
  directory = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"
